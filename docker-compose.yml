x-entorno-comun: &entorno-comun
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  TZ: America/La_Paz

x-comprobacion-http: &comprobacion-http
  interval: 5s
  timeout: 5s
  retries: 20
  start_period: 10s

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --default-time-zone=-04:00
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/La_Paz
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bdMicroMercadoArqui.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  reportes:
    image: puntomarket-reportes
    build:
      context: .
      dockerfile: Servicio3.Reportes/Dockerfile
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      <<: *entorno-comun
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};"
      Jwt__Key: ${Jwt__Key:?Defina Jwt__Key en el archivo .env}
      Jwt__Issuer: ${Jwt__Issuer:?Defina Jwt__Issuer en el archivo .env}
      Jwt__Audience: ${Jwt__Audience:?Defina Jwt__Audience en el archivo .env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      <<: *comprobacion-http
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/salud HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]

  frontend:
    image: puntomarket-frontend
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - dataprotection_keys:/keys
    environment:
      <<: *entorno-comun
      REPLICA_ID: frontend
      ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=True;SslMode=Preferred;"
      Servicios__Reportes__BaseUrl: http://reportes:8080
      Activacion__BaseUrl: ${ACTIVACION_BASE_URL:-http://localhost:8080}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-PuntoMarket}
      Smtp__UserName: ${SMTP_USER_NAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      reportes:
        condition: service_healthy
    healthcheck:
      <<: *comprobacion-http
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /Login HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]

volumes:
  mysql_data:
  dataprotection_keys:
