
x-app: &app
  image: puntomarket-app
  build: .
  restart: unless-stopped
  volumes:
    - dataprotection_keys:/keys
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

x-app-secundaria: &app-secundaria
  <<: *app
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    app1:
      condition: service_healthy

x-app-entorno: &app-entorno
  ASPNETCORE_ENVIRONMENT: Production
  TZ: America/La_Paz
  ASPNETCORE_URLS: http://+:8080
  ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};Uid=${MYSQL_USER};Pwd=${MYSQL_PASSWORD};AllowPublicKeyRetrieval=True;SslMode=Preferred;"
  ConnectionStrings__Redis: redis:6379
  Activacion__BaseUrl: ${ACTIVACION_BASE_URL:-http://localhost:8080}
  Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
  Smtp__Port: ${SMTP_PORT:-587}
  Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
  Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
  Smtp__FromName: ${SMTP_FROM_NAME:-PuntoMarket}
  Smtp__UserName: ${SMTP_USER_NAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --default-time-zone=-04:00
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/La_Paz
    volumes:
      - mysql_data:/var/lib/mysql
      - ./bdMicroMercadoArqui.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    <<: *app
    environment:
      <<: *app-entorno
      REPLICA_ID: app1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /Login HTTP/1.0\r\n\r\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app2:
    <<: *app-secundaria
    environment:
      <<: *app-entorno
      REPLICA_ID: app2

  app3:
    <<: *app-secundaria
    environment:
      <<: *app-entorno
      REPLICA_ID: app3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  mysql_data:
  dataprotection_keys:
